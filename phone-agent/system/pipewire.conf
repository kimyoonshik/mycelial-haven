# 전화 비서: 통화 음성이 지나가는 가상 장치. (설치 위치: ~/.config/pipewire/pipewire.conf.d/50-phone-agent.conf)
#
# PipeWire 는 휴대폰 통화 음성을 "기본 출력 장치로 재생 / 기본 입력 장치에서 녹음"하는 스트림으로 다룹니다.
# 그래서 우선순위(priority.session)로 아래 장치가 기본 장치가 되게 합니다.
#   phone_agent_rx    (출력, 기본)  상대방 목소리가 들어옴 → 프로그램이 여기서 녹음해 AI로 보냄
#   phone_agent_tx    (입력, 기본)  휴대폰이 여기서 가져가 상대방에게 보냄
#   phone_agent_tx_in (출력)        프로그램이 AI 목소리를 재생하는 곳. phone_agent_tx 로 그대로 이어짐
#
# 우선순위 숫자는 바꾸지 마세요. 잘못되면 상대방 목소리가 상대방에게 되돌아갑니다.
#   - 기본 입력은 출력 장치의 "모니터"도 후보가 되고, 같은 값이면 먼저 발견된 쪽이 뽑힙니다.
#     그래서 phone_agent_tx 가 phone_agent_rx 보다 커야 합니다.
#   - phone_agent_tx_in 이 기본 출력이 되면 안 되므로 가장 낮게 둡니다.
# `phone-agent status` 가 기본 장치가 맞게 잡혔는지 확인해 줍니다.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "phone_agent_rx"
      node.description = "Phone Agent: voice from the call"
      media.class      = Audio/Sink
      audio.position   = [ MONO ]
      priority.session = 3000
    }
  }
]
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      audio.position = [ MONO ]
      capture.props = {
        node.name        = "phone_agent_tx_in"
        node.description = "Phone Agent: AI voice in"
        media.class      = Audio/Sink
        priority.session = 1
      }
      playback.props = {
        node.name        = "phone_agent_tx"
        node.description = "Phone Agent: voice into the call"
        media.class      = Audio/Source
        priority.session = 3100
      }
    }
  }
]
