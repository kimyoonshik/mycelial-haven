# 전화 비서: 블루투스 설정. (설치 위치: ~/.config/wireplumber/wireplumber.conf.d/50-phone-agent.conf)
# 휴대폰에는 통화용 핸즈프리(HFP)로만 붙습니다. 음악용 프로파일을 켜면 아이폰이 이 기기를 스피커로도 씁니다.
monitor.bluez.properties = {
  bluez5.roles = [ hfp_hf ]
  bluez5.hfphsp-backend = "native"
}
# 모니터 로그인 없이(SSH·자동 실행) 쓰는 기기라, 로그인 화면이 활성일 때만 블루투스를 켜는 기능을 끕니다.
# 끄지 않으면 블루투스 장치가 아예 잡히지 않습니다.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
