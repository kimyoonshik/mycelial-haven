# /etc/nginx/sites-available/mycogen  (install.sh 가 설치)
# Cloudflare Tunnel(cloudflared)이 같은 서버에서 http://127.0.0.1:8080 으로 넘겨 주는 요청만 받습니다.
# 사내망·인터넷에 포트를 열지 않습니다(공유기 포트포워딩 불필요).
server {
    listen 127.0.0.1:8080;
    server_name www.mycogen.co.kr mycogen.co.kr;
    server_tokens off;
    charset utf-8;

    # 서버가 DB 글을 합쳐 만든 사이트 (server.env 의 DIST_DIR)
    root /srv/mycogen/www;
    index index.html;

    # 방문자 실제 IP를 접속 기록에 남김 (cloudflared 가 CF-Connecting-IP 로 넘겨 줌)
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # www 없는 주소는 www 로
    if ($host = mycogen.co.kr) {
        return 301 https://www.mycogen.co.kr$request_uri;
    }

    # 문의 양식 → Node 서버 (server.mjs, PORT 4780)
    location = /api/contact {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4780;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # CSS·JS 는 주소에 버전(?v=)이 붙어 있어 오래 저장해도 됨
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location /media/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # .htaccess 등 숨김 파일은 보이지 않게
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
